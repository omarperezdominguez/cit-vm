# /etc/mosquitto/conf.d/cit.conf -- broker de Edge Mobility (ADR-001)
# Generado desde ~/cit-vm/config/mosquitto-cit.conf por instalar.sh.
#
# persistence y persistence_location ya vienen en mosquitto.conf (Debian).
# La persistencia es obligatoria: el agente de la Jetson usa sesion
# persistente para recibir un comando mandado mientras no tenia senal.

# Por omision se guarda a disco cada 30 min; si el broker cae entre medias se
# pierde lo encolado para las unidades sin senal. 30 s es barato aqui.
autosave_interval 30

# Cola por cliente desconectado (QoS 1). La ingesta tambien la usa si se
# reinicia: con sesion persistente no pierde lo que llegue mientras.
max_queued_messages 1000
# Una unidad que no vuelve en 14 dias deja de ocupar cola
persistent_client_expiration 14d

# Las mismas credenciales y ACL valen para todos los listeners
per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# --- Hacia fuera: solo TLS ---------------------------------------------------
listener 8883 0.0.0.0
certfile /etc/mosquitto/certs/servidor.crt
keyfile  /etc/mosquitto/certs/servidor.key
cafile   /etc/mosquitto/certs/ca.crt
tls_version tlsv1.2
# TLS mutuo apagado: la unidad se identifica con usuario y contrasena propios.
require_certificate false

# --- Solo dentro de la VM: ingesta y API -------------------------------------
# Sin TLS porque no sale de la maquina; sigue exigiendo usuario y ACL.
listener 1883 127.0.0.1
